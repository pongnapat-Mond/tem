<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extreme BPM Analyzer - Vercel Test</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/music-tempo@1.0.2/dist/music-tempo.min.js"></script>
    
    <style>

    </style>
</head>
<body>
    <div class="container">
        <h1>Extreme BPM Analyzer</h1>
        <p>Vercel Deployment Test (Max 1,100 BPM)</p>
        <input type="file" id="upload" accept="audio/*" style="display:none">
        <button class="upload-btn" onclick="document.getElementById('upload').click()">เลือกไฟล์เพลง</button>
        <div id="status">รอการอัปโหลด...</div>
        <canvas id="bpmChart"></canvas>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const status = document.getElementById('status');
        let chart = null;

        upload.addEventListener('change', async (e) => {
            if (typeof MusicTempo === 'undefined') {
                status.innerText = "Error: Library ยังไม่โหลด! ลองปิด Adblock หรือเปลี่ยน Browser";
                return;
            }
            
            const file = e.target.files[0];
            if (!file) return;

            try {
                status.innerText = "กำลังประมวลผลไฟล์...";
                const arrayBuffer = await file.arrayBuffer();
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                const channelData = audioBuffer.getChannelData(0);
                const sampleRate = audioBuffer.sampleRate;
                const segmentDuration = 1; // ความละเอียดสูงสำหรับ Extratone
                const step = segmentDuration * sampleRate;
                
                let bpmData = [];
                let labels = [];

                for (let i = 0; i < channelData.length; i += step) {
                    const segment = channelData.slice(i, i + step);
                    if (segment.length < sampleRate * 0.5) continue; 
                    const mt = new MusicTempo(segment);
                    if (mt.tempo > 0) {
                        bpmData.push(Math.round(mt.tempo));
                        labels.push(`${Math.floor(i / sampleRate)}s`);
                    }
                }

                renderChart(labels, bpmData);
                status.innerText = `เสร็จสิ้น! สูงสุด: ${Math.max(...bpmData)} BPM / เฉลี่ย: ${Math.round(new MusicTempo(channelData).tempo)} BPM`;
            } catch (err) {
                status.innerText = "เกิดข้อผิดพลาดในการอ่านไฟล์";
            }
        });

        function renderChart(labels, data) {
            const ctx = document.getElementById('bpmChart').getContext('2d');
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'BPM',
                        data: data,
                        borderColor: '#0f8',
                        borderWidth: 2,
                        fill: false,
                        tension: 0.1
                    }]
                },
                options: {
                    scales: { y: { min: 0, max: 1200 } }
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Analyzer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/music-tempo@1.0.2/dist/music-tempo.min.js"></script>
    
    <style>

    </style>
</head>
<body>
    <div class="container">
        <h1>Extreme BPM Analyzer</h1>
        <p>รองรับการวิเคราะห์สูงสุด 1,100+ BPM (Extratone Mode)</p>
        <input type="file" id="upload" accept="audio/*">
        <div id="status">รอการอัปโหลดไฟล์...</div>
        <div class="chart-wrapper">
            <canvas id="bpmChart"></canvas>
        </div>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const status = document.getElementById('status');
        let chart = null;

        upload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                status.innerText = "กำลังวิเคราะห์ไฟล์ความเร็วสูง...";
                const arrayBuffer = await file.arrayBuffer();
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                const channelData = audioBuffer.getChannelData(0);
                const sampleRate = audioBuffer.sampleRate;
                
                // --- ปรับจูนสำหรับเพลงเร็ว (Extratone) ---
                const segmentDuration = 1; // วิเคราะห์ทุกๆ 1 วินาทีเพื่อให้ทัน 1100 BPM
                const step = segmentDuration * sampleRate;
                
                let bpmData = [];
                let labels = [];

                for (let i = 0; i < channelData.length; i += step) {
                    const segment = channelData.slice(i, i + step);
                    if (segment.length < sampleRate * 0.5) continue; 

                    const mt = new MusicTempo(segment);
                    let detectedBpm = Math.round(mt.tempo);

                    // Logic พิเศษ: ถ้าเพลงเร็วจนหลุดขีดจำกัด (Aliasing)
                    // ในบางกรณี Library อาจจะวัดได้แค่ครึ่งเดียว (เช่น 440 แทนที่จะเป็น 880)
                    // แต่ในที่นี้เราจะดึงค่าตรงๆ ออกมาก่อน
                    if (detectedBpm > 0) {
                        bpmData.push(detectedBpm);
                        labels.push(`${Math.floor(i / sampleRate)}s`);
                    }
                }

                renderChart(labels, bpmData);
                status.innerText = `วิเคราะห์เสร็จสิ้น! พบช่วงความเร็วสูงสุดที่ ${Math.max(...bpmData)} BPM`;
                
            } catch (err) {
                console.error(err);
                status.innerText = "เกิดข้อผิดพลาด: " + err.message;
            }
        });

        function renderChart(labels, data) {
            const ctx = document.getElementById('bpmChart').getContext('2d');
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Tempo (BPM)',
                        data: data,
                        borderColor: '#ff0055', // สีแดงจัดจ้านสำหรับเพลงแรงๆ
                        backgroundColor: 'rgba(255, 0, 85, 0.1)',
                        borderWidth: 2,
                        tension: 0.1, // ลดความโค้งเพื่อให้เห็นการดีดของจังหวะชัดเจน
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            min: 0,
                            max: 1200, // ตั้งเผื่อไว้ที่ 1200 BPM
                            ticks: { color: '#888', stepSize: 100 },
                            grid: { color: '#222' },
                            title: { display: true, text: 'Beats Per Minute', color: '#eee' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#888' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#eee' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
